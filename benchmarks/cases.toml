# Known cases of the DPC radar data, with the answer we expect.
#
# Every case is one frame and the frame before it (30 minutes earlier), cropped
# to `bbox` (west, south, east, north, degrees) and saved under frames/<id>/ by
# fetch.py. Each check asks one question a method must answer:
#
#   kind = "frame"    is the frame usable at all?                 expect = true | false
#   kind = "value"    the rain at a point after the method's      min / max (mm),
#                     cleaning, read like Limen (3x3 median)       masked_ok: is "not measured" fine?
#   kind = "masked"   share of the valid pixels the method throws away    max (0-1)
#   kind = "reliable" can the radar be trusted at this point?    expect = true | false
#
# status = "confirmed": the answer is known (from Limen, the gauges, the DPC series).
# status = "suspect":   our best reading, not confirmed yet; scored apart.
#
# Radar data © Dipartimento della Protezione Civile, CC BY-SA 4.0.

# --- Real rain: a cleaning rule must keep it ------------------------------------

[[case]]
id = "melito-2026-10-10T06"
title = "The Reggio Calabria storm, morning of 10 October 2026"
status = "confirmed"
product = "CUM24"
time = 2026-10-10T06:00:00Z
bbox = [14.5, 37.6, 17.3, 39.5]
source = "Limen flood.yaml and limen#199: forecast 20 mm, radar 152 mm at Melito; the :00 and :30 frames agree here (180.4 and 180.8 mm)"

[[case.check]]
kind = "frame"
expect = true

[[case.check]]
kind = "value"
name = "Melito di Porto Salvo"
lon = 15.78
lat = 37.92
min = 100.0
max = 300.0
masked_ok = false

[[case.check]]
kind = "value"
name = "Bagaladi"
lon = 15.81
lat = 38.05
min = 80.0
max = 250.0
masked_ok = false

[[case.check]]
kind = "reliable"
name = "Lipari: a cloudburst the radar did not see"
lon = 14.95
lat = 38.47
expect = false

[[case]]
id = "melito-2026-10-11T00"
title = "The whole day of 10 October 2026 at Melito"
status = "confirmed"
product = "CUM24"
time = 2026-10-11T00:00:00Z
bbox = [14.5, 37.6, 17.3, 39.5]
source = "«Merging» CUM24 of the day, 185-192 mm at Melito; the figure of the README"

[[case.check]]
kind = "value"
name = "Melito di Porto Salvo"
lon = 15.78
lat = 37.92
min = 150.0
max = 300.0
masked_ok = false

