site_name: dpc-radar
site_description: Rain over Italy from the Civil Protection radar, in a few lines of Python
site_url: https://agentengineering.it/dpc-radar/
repo_url: https://github.com/agent-engineering-studio/dpc-radar
repo_name: agent-engineering-studio/dpc-radar
edit_uri: edit/main/docs/
copyright: Code Apache-2.0. Radar data © Dipartimento della Protezione Civile, CC BY-SA 4.0.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# The README is written for GitHub: its relative links (LICENSE, CHANGELOG)
# point at the repository, not at the site.
validation:
  links:
    not_found: info
    unrecognized_links: info
    anchors: info

nav:
  - Home: index.md
  - API reference:
      - Client: api/client.md
      - Rain grid: api/grid.md
      - Archive: api/archive.md
      - History (IT-DPC-SRI): api/history.md
      - Products and API: api/products.md
      - Errors: api/errors.md
  - Benchmark: benchmark.md
  - Roadmap and AI: roadmap.md
  - Changelog: changelog.md
  - Contributing: contributing.md
